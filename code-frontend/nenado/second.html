<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="second.css">
</head>
<body>
    <form id="logform">
        <h1>Логин</h1>
        <input type="text" id="username" placeholder="Введите логин" required>
        <input type="password" id="password" placeholder="Введите пароль" required>
        <button id="login">Войти</button>
        <button id="toreg">Регистрация</button>
        <div id="status"></div>
    </form>
    
    <form id="regform">
        <h1>Регистрация</h1>
        <input type="text" id="rusername" placeholder="Введите логин">
        <input type="password" id="rpassword" placeholder="Введите пароль">
        <input type="email" id="remail" placeholder="Введите gmail">
        <button id="register">Зарегистрироваться</button>
        <button id="tolog">Залогиниться</button>
        <div id="rstatus"></div>
    </form>
    <script src="second.js"></script>
</body>
</html>
