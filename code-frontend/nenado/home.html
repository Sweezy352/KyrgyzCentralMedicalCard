<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calc">
        <h1>Калькулятор</h1>
        <input type="text" placeholder="1 цифра" id="first" value="2">
        <input type="text" placeholder="2 цифра" id="second" value="3">
        <div class="plusminus">
            <button id='plus' class="plus">+</button>
            <button id="minus" class="minus">-</button>
        </div>
        <button id="calculate" class="calculate">Вычислить</button>
        <div class="result">
            <b>Результат</b>
            <p id="result"></p>
        </div>
    </div>
    
    <script src="code.js">
    </script>
</body>
</html>
