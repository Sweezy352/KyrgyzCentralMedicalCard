<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новостная лента Лицей 99 - MVP Demo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #667eea;
            --primary-dark: #5a67d8;
            --secondary: #764ba2;
            --success: #48bb78;
            --warning: #ed8936;
            --danger: #f56565;
            --dark: #2d3748;
            --gray: #718096;
            --light: #f7fafc;
            --white: #ffffff;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.15);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: var(--dark);
        }

        .app-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        .header {
            background: var(--white);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: var(--shadow-lg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo i {
            font-size: 2.5rem;
            color: var(--primary);
        }

        .logo h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
            background: var(--light);
            padding: 10px 20px;
            border-radius: 12px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            font-weight: 600;
        }

        /* Main Layout */
        .main-content {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        /* Sidebar */
        .sidebar {
            background: var(--white);
            border-radius: 20px;
            padding: 25px;
            box-shadow: var(--shadow-lg);
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .nav-menu {
            list-style: none;
        }

        .nav-item {
            margin-bottom: 10px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 12px;
            text-decoration: none;
            color: var(--dark);
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .nav-link:hover, .nav-link.active {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--white);
            transform: translateX(5px);
        }

        .nav-link i {
            width: 20px;
            text-align: center;
        }

        /* News Feed */
        .news-feed {
            background: var(--white);
            border-radius: 20px;
            padding: 25px;
            box-shadow: var(--shadow-lg);
        }

        .feed-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .feed-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--dark);
        }

        .add-news-btn {
            background: linear-gradient(135deg, var(--success), #38a169);
            color: var(--white);
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .add-news-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(72, 187, 120, 0.3);
        }

        /* Categories */
        .categories {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .category-btn {
            background: var(--light);
            border: 2px solid transparent;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .category-btn:hover {
            background: #e2e8f0;
        }

        .category-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--white);
            border-color: var(--primary);
        }

        /* News Cards */
        .news-card {
            background: var(--light);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 4px solid var(--primary);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .news-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow);
        }

        .news-card.urgent {
            border-left-color: var(--danger);
            background: #fff5f5;
        }

        .news-card.important {
            border-left-color: var(--warning);
            background: #fffbf0;
        }

        .news-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
            gap: 15px;
        }

        .news-meta {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 0.9rem;
            color: var(--gray);
        }

        .news-category {
            background: var(--primary);
            color: var(--white);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .news-category.urgent {
            background: var(--danger);
        }

        .news-category.important {
            background: var(--warning);
        }

        .news-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .news-content {
            color: var(--gray);
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .news-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .news-action {
            background: none;
            border: none;
            color: var(--gray);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .news-action:hover {
            color: var(--primary);
            transform: scale(1.1);
        }

        .news-action.liked {
            color: var(--danger);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--white);
            border-radius: 20px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            animation: modalSlideIn 0.3s ease;
        }

        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--dark);
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--gray);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .modal-close:hover {
            color: var(--danger);
            transform: rotate(90deg);
        }

        /* Form */
        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--dark);
        }

        .form-input, .form-textarea, .form-select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .form-input:focus, .form-textarea:focus, .form-select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-textarea {
            resize: vertical;
            min-height: 120px;
        }

        .form-actions {
            display: flex;
            gap: 15px;
            justify-content: flex-end;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            font-size: 1rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--white);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: var(--light);
            color: var(--dark);
        }

        .btn-secondary:hover {
            background: #e2e8f0;
        }

        /* Stats */
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--white);
            border-radius: 15px;
            padding: 20px;
            box-shadow: var(--shadow);
            text-align: center;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
        }

        .stat-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
            color: var(--primary);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 5px;
        }

        .stat-label {
            color: var(--gray);
            font-weight: 500;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .sidebar {
                position: static;
            }
            
            .header {
                flex-direction: column;
                text-align: center;
            }
            
            .feed-header {
                flex-direction: column;
                align-items: stretch;
            }
            
            .add-news-btn {
                justify-content: center;
            }
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--gray);
        }

        .loading i {
            font-size: 3rem;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--gray);
        }

        .empty-state i {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: var(--dark);
        }

        /* Toast Notifications */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--white);
            padding: 16px 20px;
            border-radius: 12px;
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 12px;
            transform: translateX(400px);
            transition: transform 0.3s ease;
            z-index: 2000;
            max-width: 350px;
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast.success {
            border-left: 4px solid var(--success);
        }

        .toast.error {
            border-left: 4px solid var(--danger);
        }

        .toast.info {
            border-left: 4px solid var(--primary);
        }

        .toast-icon {
            font-size: 1.2rem;
        }

        .toast.success .toast-icon {
            color: var(--success);
        }

        .toast.error .toast-icon {
            color: var(--danger);
        }

        .toast.info .toast-icon {
            color: var(--primary);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <i class="fas fa-graduation-cap"></i>
                <h1>Лицей 99</h1>
            </div>
            <div class="user-info">
                <div class="user-avatar">А</div>
                <div>
                    <div style="font-weight: 600;">Администратор</div>
                    <div style="font-size: 0.9rem; color: var(--gray);">Демо-режим</div>
                </div>
            </div>
        </header>

        <!-- Stats -->
        <div class="stats-container">
            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-newspaper"></i>
                </div>
                <div class="stat-value" id="totalNews">0</div>
                <div class="stat-label">Всего новостей</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-users"></i>
                </div>
                <div class="stat-value">1,247</div>
                <div class="stat-label">Пользователей</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-eye"></i>
                </div>
                <div class="stat-value" id="totalViews">0</div>
                <div class="stat-label">Просмотров</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-heart"></i>
                </div>
                <div class="stat-value" id="totalLikes">0</div>
                <div class="stat-label">Лайков</div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Sidebar -->
            <aside class="sidebar">
                <nav>
                    <ul class="nav-menu">
                        <li class="nav-item">
                            <a href="#" class="nav-link active" data-page="news">
                                <i class="fas fa-home"></i>
                                <span>Новости</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="#" class="nav-link" data-page="urgent">
                                <i class="fas fa-exclamation-triangle"></i>
                                <span>Срочные</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="#" class="nav-link" data-page="academic">
                                <i class="fas fa-book"></i>
                                <span>Учеба</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="#" class="nav-link" data-page="events">
                                <i class="fas fa-calendar"></i>
                                <span>События</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="#" class="nav-link" data-page="sports">
                                <i class="fas fa-running"></i>
                                <span>Спорт</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="#" class="nav-link" data-page="creative">
                                <i class="fas fa-palette"></i>
                                <span>Творчество</span>
                            </a>
                        </li>
                    </ul>
                </nav>
            </aside>

            <!-- News Feed -->
            <main class="news-feed">
                <div class="feed-header">
                    <h2 class="feed-title">Лента новостей</h2>
                    <button class="add-news-btn" id="addNewsBtn">
                        <i class="fas fa-plus"></i>
                        Добавить новость
                    </button>
                </div>

                <!-- Categories -->
                <div class="categories">
                    <button class="category-btn active" data-category="all">Все</button>
                    <button class="category-btn" data-category="urgent">Срочные</button>
                    <button class="category-btn" data-category="academic">Учеба</button>
                    <button class="category-btn" data-category="events">События</button>
                    <button class="category-btn" data-category="sports">Спорт</button>
                    <button class="category-btn" data-category="creative">Творчество</button>
                </div>

                <!-- News List -->
                <div id="newsList">
                    <div class="loading">
                        <i class="fas fa-spinner"></i>
                        <p>Загрузка новостей...</p>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Add News Modal -->
    <div class="modal" id="addNewsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Добавить новость</h3>
                <button class="modal-close" id="closeModal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form id="addNewsForm">
                <div class="form-group">
                    <label class="form-label">Заголовок</label>
                    <input type="text" class="form-input" id="newsTitle" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Категория</label>
                    <select class="form-select" id="newsCategory" required>
                        <option value="academic">Учеба</option>
                        <option value="events">События</option>
                        <option value="sports">Спорт</option>
                        <option value="creative">Творчество</option>
                        <option value="urgent">Срочное</option>
                        <option value="important">Важное</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Содержание</label>
                    <textarea class="form-textarea" id="newsContent" required></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="cancelBtn">Отмена</button>
                    <button type="submit" class="btn btn-primary">Опубликовать</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer"></div>

    <script>
        // Database Manager (localStorage)
        class DatabaseManager {
            constructor() {
                this.initializeData();
            }

            initializeData() {
                if (!localStorage.getItem('news')) {
                    const sampleNews = [
                        {
                            id: 1,
                            title: '🎓 Выпускные экзамены начнутся 25 мая',
                            category: 'academic',
                            content: 'Уважаемые выпускники! Напоминаем, что выпускные экзамены начнутся 25 мая. Пожалуйста, подготовьте все необходимые документы и приходите за 30 минут до начала.',
                            author: 'Администрация',
                            date: new Date('2024-05-15').toISOString(),
                            views: 245,
                            likes: 18,
                            priority: 'important'
                        },
                        {
                            id: 2,
                            title: '🏆 Наши ученики победили в олимпиаде по математике',
                            category: 'academic',
                            content: 'Поздравляем учеников 11 "А" класса с победой в республиканской олимпиаде по математике! Команда заняла 1 место среди 120 школ.',
                            author: 'Учителя математики',
                            date: new Date('2024-05-14').toISOString(),
                            views: 189,
                            likes: 45,
                            priority: 'normal'
                        },
                        {
                            id: 3,
                            title: '⚠️ Срочно: Изменение расписания на завтра',
                            category: 'urgent',
                            content: 'В связи с погодными условиями, завтрашние занятия начинаются на 1 час позже - в 9:00. Пожалуйста, информируйте родителей.',
                            author: 'Директор',
                            date: new Date('2024-05-16T08:00:00').toISOString(),
                            views: 412,
                            likes: 8,
                            priority: 'urgent'
                        },
                        {
                            id: 4,
                            title: '🎭 Школьный спектакль "Ромео и Джульетта"',
                            category: 'creative',
                            content: 'Приглашаем всех на школьный спектакль "Ромео и Джульетта" который состоится 20 мая в 15:00 в актовом зале. Вход свободный!',
                            author: 'Драматический кружок',
                            date: new Date('2024-05-13').toISOString(),
                            views: 156,
                            likes: 23,
                            priority: 'normal'
                        },
                        {
                            id: 5,
                            title: '🏀 Финал баскетбольного турнира',
                            category: 'sports',
                            content: 'Завтра в 16:00 состоится финал школьного баскетбольного турнира. Команда 10 "Б" класса против команды 11 "В" класса. Приходите поддержать!',
                            author: 'Физкультура',
                            date: new Date('2024-05-15').toISOString(),
                            views: 98,
                            likes: 31,
                            priority: 'normal'
                        }
                    ];
                    localStorage.setItem('news', JSON.stringify(sampleNews));
                }

                if (!localStorage.getItem('stats')) {
                    const stats = {
                        totalViews: 1100,
                        totalLikes: 125
                    };
                    localStorage.setItem('stats', JSON.stringify(stats));
                }
            }

            getNews() {
                return JSON.parse(localStorage.getItem('news') || '[]');
            }

            addNews(news) {
                const newsList = this.getNews();
                const newNews = {
                    ...news,
                    id: Date.now(),
                    date: new Date().toISOString(),
                    views: 0,
                    likes: 0,
                    author: 'Администратор'
                };
                newsList.unshift(newNews);
                localStorage.setItem('news', JSON.stringify(newsList));
                return newNews;
            }

            updateNewsViews(id) {
                const newsList = this.getNews();
                const news = newsList.find(n => n.id === id);
                if (news) {
                    news.views++;
                    localStorage.setItem('news', JSON.stringify(newsList));
                    this.updateStats('views', 1);
                }
            }

            updateNewsLikes(id) {
                const newsList = this.getNews();
                const news = newsList.find(n => n.id === id);
                if (news) {
                    news.likes++;
                    localStorage.setItem('news', JSON.stringify(newsList));
                    this.updateStats('likes', 1);
                }
            }

            getStats() {
                return JSON.parse(localStorage.getItem('stats') || '{"totalViews": 0, "totalLikes": 0}');
            }

            updateStats(type, increment) {
                const stats = this.getStats();
                if (type === 'views') {
                    stats.totalViews += increment;
                } else if (type === 'likes') {
                    stats.totalLikes += increment;
                }
                localStorage.setItem('stats', JSON.stringify(stats));
            }
        }

        // App Controller
        class NewsApp {
            constructor() {
                this.db = new DatabaseManager();
                this.currentCategory = 'all';
                this.news = [];
                this.init();
            }

            init() {
                this.loadNews();
                this.setupEventListeners();
                this.updateStats();
            }

            setupEventListeners() {
                // Add news button
                document.getElementById('addNewsBtn').addEventListener('click', () => {
                    this.openModal();
                });

                // Modal controls
                document.getElementById('closeModal').addEventListener('click', () => {
                    this.closeModal();
                });

                document.getElementById('cancelBtn').addEventListener('click', () => {
                    this.closeModal();
                });

                // Form submission
                document.getElementById('addNewsForm').addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.addNews();
                });

                // Category filters
                document.querySelectorAll('.category-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        this.filterByCategory(e.target.dataset.category);
                    });
                });

                // Navigation
                document.querySelectorAll('.nav-link').forEach(link => {
                    link.addEventListener('click', (e) => {
                        e.preventDefault();
                        this.setActiveNav(e.target.closest('.nav-link'));
                        const page = e.target.closest('.nav-link').dataset.page;
                        if (page === 'urgent') {
                            this.filterByCategory('urgent');
                        } else {
                            this.filterByCategory('all');
                        }
                    });
                });

                // Close modal on outside click
                document.getElementById('addNewsModal').addEventListener('click', (e) => {
                    if (e.target.id === 'addNewsModal') {
                        this.closeModal();
                    }
                });
            }

            loadNews() {
                this.news = this.db.getNews();
                this.renderNews();
            }

            renderNews() {
                const newsList = document.getElementById('newsList');
                const filteredNews = this.currentCategory === 'all' 
                    ? this.news 
                    : this.news.filter(n => n.category === this.currentCategory);

                if (filteredNews.length === 0) {
                    newsList.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-newspaper"></i>
                            <h3>Новостей пока нет</h3>
                            <p>Будьте первым, кто добавит новость!</p>
                        </div>
                    `;
                    return;
                }

                newsList.innerHTML = filteredNews.map(news => this.createNewsCard(news)).join('');
                
                // Add event listeners to news cards
                document.querySelectorAll('.news-card').forEach(card => {
                    card.addEventListener('click', (e) => {
                        if (!e.target.closest('.news-action')) {
                            const newsId = parseInt(card.dataset.newsId);
                            this.db.updateNewsViews(newsId);
                            this.updateStats();
                            this.showToast('Новость просмотрена', 'info');
                        }
                    });
                });

                document.querySelectorAll('.like-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const newsId = parseInt(btn.dataset.newsId);
                        this.db.updateNewsLikes(newsId);
                        this.updateStats();
                        btn.classList.add('liked');
                        btn.querySelector('span').textContent = parseInt(btn.querySelector('span').textContent) + 1;
                        this.showToast('Лайк поставлен!', 'success');
                    });
                });
            }

            createNewsCard(news) {
                const categoryColors = {
                    urgent: '#f56565',
                    important: '#ed8936',
                    academic: '#667eea',
                    events: '#48bb78',
                    sports: '#38b2ac',
                    creative: '#9f7aea'
                };

                const categoryNames = {
                    urgent: 'Срочное',
                    important: 'Важное',
                    academic: 'Учеба',
                    events: 'События',
                    sports: 'Спорт',
                    creative: 'Творчество'
                };

                const date = new Date(news.date);
                const formattedDate = date.toLocaleDateString('ru-RU', {
                    day: 'numeric',
                    month: 'long',
                    hour: '2-digit',
                    minute: '2-digit'
                });

                return `
                    <div class="news-card ${news.priority}" data-news-id="${news.id}">
                        <div class="news-header">
                            <div class="news-meta">
                                <span class="news-category ${news.priority}" style="background: ${categoryColors[news.category]}">
                                    ${categoryNames[news.category]}
                                </span>
                                <span>${formattedDate}</span>
                                <span>👁 ${news.views}</span>
                            </div>
                        </div>
                        <h3 class="news-title">${news.title}</h3>
                        <p class="news-content">${news.content}</p>
                        <div class="news-actions">
                            <button class="news-action like-btn" data-news-id="${news.id}">
                                <i class="fas fa-heart"></i>
                                <span>${news.likes}</span>
                            </button>
                            <button class="news-action">
                                <i class="fas fa-share"></i>
                                <span>Поделиться</span>
                            </button>
                            <button class="news-action">
                                <i class="fas fa-bookmark"></i>
                                <span>Сохранить</span>
                            </button>
                        </div>
                    </div>
                `;
            }

            filterByCategory(category) {
                this.currentCategory = category;
                
                // Update active button
                document.querySelectorAll('.category-btn').forEach(btn => {
                    btn.classList.remove('active');
                });
                document.querySelector(`[data-category="${category}"]`).classList.add('active');
                
                this.renderNews();
            }

            setActiveNav(activeLink) {
                document.querySelectorAll('.nav-link').forEach(link => {
                    link.classList.remove('active');
                });
                activeLink.classList.add('active');
            }

            openModal() {
                document.getElementById('addNewsModal').classList.add('active');
                document.getElementById('newsTitle').focus();
            }

            closeModal() {
                document.getElementById('addNewsModal').classList.remove('active');
                document.getElementById('addNewsForm').reset();
            }

            addNews() {
                const title = document.getElementById('newsTitle').value;
                const category = document.getElementById('newsCategory').value;
                const content = document.getElementById('newsContent').value;

                const news = { title, category, content };
                const newNews = this.db.addNews(news);
                
                this.news.unshift(newNews);
                this.renderNews();
                this.updateStats();
                this.closeModal();
                this.showToast('Новость успешно добавлена!', 'success');
            }

            updateStats() {
                const stats = this.db.getStats();
                document.getElementById('totalNews').textContent = this.news.length;
                document.getElementById('totalViews').textContent = stats.totalViews;
                document.getElementById('totalLikes').textContent = stats.totalLikes;
            }

            showToast(message, type = 'info') {
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                
                const icons = {
                    success: 'fas fa-check-circle',
                    error: 'fas fa-exclamation-circle',
                    info: 'fas fa-info-circle'
                };

                toast.innerHTML = `
                    <i class="toast-icon ${icons[type]}"></i>
                    <span>${message}</span>
                `;

                document.getElementById('toastContainer').appendChild(toast);

                setTimeout(() => toast.classList.add('show'), 100);
                setTimeout(() => {
                    toast.classList.remove('show');
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            }
        }

        // Initialize app
        document.addEventListener('DOMContentLoaded', () => {
            new NewsApp();
        });
    </script>
</body>
</html>
